<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 120" width="168" height="120" font-family="Inter, Arial, sans-serif">
  <title>A stripboard: copper strips along each row of holes, with one strip cut at a hole</title>
  <defs>
    <pattern id="lp-holes" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3.2" fill="#070b12" />
    </pattern>
    <pattern id="lp-strips" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect y="2.5" width="24" height="19" fill="#c98545" />
    </pattern>
  </defs>
  <rect width="168" height="120" fill="#0a101b" />
  <rect width="168" height="120" fill="#5b3a1e" />
  <rect width="168" height="120" fill="url(#lp-strips)" />
  <circle cx="84" cy="60" r="10.5" fill="#5b3a1e" />
  <rect width="168" height="120" fill="url(#lp-holes)" />
  <circle cx="84" cy="60" r="15" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
