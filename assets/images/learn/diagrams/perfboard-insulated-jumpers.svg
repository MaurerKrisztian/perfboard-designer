  <line x1="12" y1="36" x2="156" y2="36" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
  <line x1="84" y1="12" x2="84" y2="84" stroke="#0a101b" stroke-width="11" stroke-linecap="round" />
