<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 96" width="168" height="96" font-family="Inter, Arial, sans-serif">
  <title>Copper side: two neighboring pads joined by a blob of solder, and a longer solder trail over a wire across four pads</title>
  <defs>
    <pattern id="lp-pads" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="7.5" fill="#c98545" />
      <circle cx="12" cy="12" r="3.2" fill="#070b12" />
    </pattern>
    <linearGradient id="lp-solder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.55" stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#8b98a7" />
    </linearGradient>
    <radialGradient id="lp-solder-dot" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#d4dbe3" />
      <stop offset="1" stop-color="#8b98a7" />
    </radialGradient>
  </defs>
  <rect width="168" height="96" fill="#0a101b" />
  <rect width="168" height="96" fill="#166534" />
  <rect width="168" height="96" fill="url(#lp-pads)" />
  <rect x="36" y="29" width="24" height="14" fill="url(#lp-solder)" />
  <circle cx="36" cy="36" r="8.5" fill="url(#lp-solder-dot)" />
  <circle cx="60" cy="36" r="8.5" fill="url(#lp-solder-dot)" />
  <rect x="36" y="55.5" width="72" height="9" fill="url(#lp-solder)" />
  <circle cx="36" cy="60" r="8" fill="url(#lp-solder-dot)" />
  <circle cx="60" cy="60" r="8" fill="url(#lp-solder-dot)" />
  <circle cx="84" cy="60" r="8" fill="url(#lp-solder-dot)" />
  <circle cx="108" cy="60" r="8" fill="url(#lp-solder-dot)" />
</svg>
