<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 96" width="168" height="96" font-family="Inter, Arial, sans-serif">
  <title>Copper side of a stripboard under an 8-pin chip: each strip under the chip is cut between the two rows of pins, and pin 1 is at top right</title>
  <defs>
    <pattern id="lp-holes" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3.2" fill="#070b12" />
    </pattern>
    <radialGradient id="lp-solder-dot" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#d4dbe3" />
      <stop offset="1" stop-color="#8b98a7" />
    </radialGradient>
    <pattern id="lp-strips" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect y="2.5" width="24" height="19" fill="#c98545" />
    </pattern>
  </defs>
  <rect width="168" height="96" fill="#0a101b" />
  <rect width="168" height="96" fill="#5b3a1e" />
  <rect width="168" height="96" fill="url(#lp-strips)" />
  <g fill="#5b3a1e">
    <circle cx="60" cy="12" r="10.5" /><circle cx="60" cy="36" r="10.5" />
    <circle cx="60" cy="60" r="10.5" /><circle cx="60" cy="84" r="10.5" />
  </g>
  <rect width="168" height="96" fill="url(#lp-holes)" />
  <rect x="28" y="1" width="88" height="94" rx="5" fill="#111827" fill-opacity="0.35" stroke="#94a3b8" stroke-dasharray="4 3" />
  <g fill="url(#lp-solder-dot)">
    <circle cx="36" cy="12" r="8" /><circle cx="36" cy="36" r="8" /><circle cx="36" cy="60" r="8" /><circle cx="36" cy="84" r="8" />
    <circle cx="108" cy="12" r="8" /><circle cx="108" cy="36" r="8" /><circle cx="108" cy="60" r="8" /><circle cx="108" cy="84" r="8" />
  </g>
  <rect x="97" y="1" width="22" height="22" rx="3" fill="none" stroke="#facc15" stroke-width="2" />
</svg>
