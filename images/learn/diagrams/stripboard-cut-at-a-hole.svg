<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 96" width="168" height="96" font-family="Inter, Arial, sans-serif">
  <title>Copper side of a stripboard: one strip cut at a hole, the copper ring around that hole removed</title>
  <defs>
    <pattern id="lp-holes" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3.2" fill="#070b12" />
    </pattern>
    <pattern id="lp-strips" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect y="2.5" width="24" height="19" fill="#c98545" />
    </pattern>
  </defs>
  <rect width="168" height="96" fill="#0a101b" />
  <rect width="168" height="96" fill="#5b3a1e" />
  <rect width="168" height="96" fill="url(#lp-strips)" />
  <circle cx="84" cy="36" r="10.5" fill="#5b3a1e" />
  <rect width="168" height="96" fill="url(#lp-holes)" />
  <circle cx="84" cy="36" r="15" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
